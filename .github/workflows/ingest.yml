name: Ingest competitive intelligence

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC (runs crawl-only by default)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [crawl-only, full]
        default: crawl-only

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: scripts/ingest
        run: npm install --no-audit --no-fund
      - name: Run ingestion
        working-directory: scripts/ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          INGEST_MAX_SOURCES: "25"
          # "full" only when manually chosen AND you've added ANTHROPIC_API_KEY; otherwise crawl-only.
          INGEST_NO_AI: ${{ (github.event.inputs.mode == 'full') && '0' || '1' }}
        run: npx tsx ingest.ts
