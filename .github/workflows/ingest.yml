name: Ingest competitive intelligence

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC (runs crawl-only by default)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [crawl-only, full]
        default: crawl-only

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: scripts/ingest
        run: npm install --no-audit --no-fund
      - name: Run ingestion
        working-directory: scripts/ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          INGEST_MAX_SOURCES: "25"
          INGEST_NO_AI: ${{ (github.event.inputs.mode == 'full') && '0' || '1' }}
        run: npx tsx ingest.ts
